<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Haunted House Control</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #0f0f1e 100%);
            color: #eee;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            width: 100%;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            font-size: 2.5em;
            text-shadow: 0 0 20px rgba(255, 100, 100, 0.5);
        }

        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 40px;
        }

        .status-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 25px;
            backdrop-filter: blur(10px);
        }

        .status-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 15px;
        }

        .status-item {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 10px;
        }

        .status-label {
            font-size: 0.85em;
            color: #888;
            margin-bottom: 5px;
        }

        .status-value {
            font-size: 1.3em;
            font-weight: 600;
        }

        .mode-story {
            color: #ff6b6b;
        }

        .mode-ambient {
            color: #51cf66;
        }

        .mode-idle {
            color: #ffd43b;
        }

        .controls {
            display: grid;
            gap: 15px;
        }

        button {
            padding: 18px 30px;
            font-size: 1.1em;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .btn-trigger {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a52 100%);
            color: white;
        }

        .btn-stop {
            background: linear-gradient(135deg, #868e96 0%, #6c757d 100%);
            color: white;
        }

        .btn-motion-on {
            background: linear-gradient(135deg, #51cf66 0%, #40c057 100%);
            color: white;
        }

        .btn-motion-off {
            background: linear-gradient(135deg, #ffd43b 0%, #fab005 100%);
            color: #333;
        }

        .btn-reload {
            background: linear-gradient(135deg, #4dabf7 0%, #339af0 100%);
            color: white;
        }

        .message {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
            display: none;
        }

        .message.success {
            background: rgba(81, 207, 102, 0.2);
            border: 1px solid rgba(81, 207, 102, 0.5);
            color: #51cf66;
        }

        .message.error {
            background: rgba(255, 107, 107, 0.2);
            border: 1px solid rgba(255, 107, 107, 0.5);
            color: #ff6b6b;
        }

        .loading {
            opacity: 0.6;
            pointer-events: none;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 2em;
            }

            .status-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Haunted House</h1>
        <p class="subtitle">Motion-Activated Control Panel</p>

        <div id="message" class="message"></div>

        <div class="status-card">
            <h2>System Status</h2>
            <div class="status-grid">
                <div class="status-item">
                    <div class="status-label">Current Mode</div>
                    <div class="status-value" id="mode">Loading...</div>
                </div>
                <div class="status-item">
                    <div class="status-label">Motion Detection</div>
                    <div class="status-value" id="motion-status">Loading...</div>
                </div>
                <div class="status-item">
                    <div class="status-label">Playback Status</div>
                    <div class="status-value" id="playback-status">Loading...</div>
                </div>
                <div class="status-item">
                    <div class="status-label">Can Trigger Story</div>
                    <div class="status-value" id="can-trigger">Loading...</div>
                </div>
            </div>
        </div>

        <div class="status-card controls">
            <h2>Controls</h2>
            <button class="btn-trigger" onclick="triggerStory()">Trigger Story Mode</button>
            <button class="btn-stop" onclick="stopStory()">Stop Story Mode</button>
            <button class="btn-motion-on" onclick="enableMotion()">Enable Motion Detection</button>
            <button class="btn-motion-off" onclick="disableMotion()">Disable Motion Detection</button>
            <button class="btn-reload" onclick="reloadAmbient()">Reload Ambient Videos</button>
        </div>
    </div>

    <script>
        let statusInterval;

        function showMessage(text, type = 'success') {
            const msgEl = document.getElementById('message');
            msgEl.textContent = text;
            msgEl.className = `message ${type}`;
            msgEl.style.display = 'block';
            setTimeout(() => {
                msgEl.style.display = 'none';
            }, 3000);
        }

        async function fetchStatus() {
            try {
                const response = await fetch('/api/status');
                const data = await response.json();

                // Update mode
                const modeEl = document.getElementById('mode');
                modeEl.textContent = data.mode.toUpperCase();
                modeEl.className = `status-value mode-${data.mode}`;

                // Update motion detection
                document.getElementById('motion-status').textContent =
                    data.motion_detection_enabled ? 'ENABLED' : 'DISABLED';

                // Update playback status
                document.getElementById('playback-status').textContent =
                    data.is_playing ? 'PLAYING' : 'STOPPED';

                // Update can trigger
                document.getElementById('can-trigger').textContent =
                    data.can_trigger_story ? 'YES' : 'NO';

            } catch (error) {
                console.error('Error fetching status:', error);
            }
        }

        async function apiCall(endpoint, successMessage) {
            try {
                const response = await fetch(endpoint, { method: 'POST' });
                const data = await response.json();

                if (data.success) {
                    showMessage(successMessage, 'success');
                    fetchStatus();
                } else {
                    showMessage(data.error || 'Operation failed', 'error');
                }
            } catch (error) {
                showMessage('Network error: ' + error.message, 'error');
            }
        }

        function triggerStory() {
            apiCall('/api/trigger', 'Story mode triggered!');
        }

        function stopStory() {
            apiCall('/api/stop', 'Story mode stopped');
        }

        function enableMotion() {
            apiCall('/api/motion/enable', 'Motion detection enabled');
        }

        function disableMotion() {
            apiCall('/api/motion/disable', 'Motion detection disabled');
        }

        function reloadAmbient() {
            apiCall('/api/ambient/reload', 'Ambient playlist reloaded');
        }

        // Update status every 2 seconds
        statusInterval = setInterval(fetchStatus, 2000);

        // Initial fetch
        fetchStatus();
    </script>
</body>
</html>
